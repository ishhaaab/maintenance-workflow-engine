[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "maintenance-workflow-engine"
version = "0.1.0"
description = "Approval-gated maintenance workflows with durable recovery and idempotent effects"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pymongo==4.19.0",
    "redis==8.1.0",
    "uvicorn==0.54.0",
]

[project.scripts]
workflow-engine = "workflow_engine.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engine", "src/external_simulators"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires isolated MongoDB/Redis", "compose: requires Docker Compose"]

[tool.ruff]
target-version = "py312"
line-length = 100
