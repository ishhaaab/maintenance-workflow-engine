name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.6
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/unit -q
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0.16@sha256:c630c59342c1493d50345136df2af14a76b9e827dd5316bfabee07a0880a5f3a
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2.7@sha256:96af50b9ce0cd7f44f73266ce90bb63a6d6d5655adb8854d2723a0382524c8f3
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_MONGO_URL: mongodb://127.0.0.1:27017
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.6
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/integration tests/e2e/test_workflow.py --ignore=tests/integration/test_fault_matrix.py -q
      - run: uv run python scripts/benchmark_faults.py --output-dir artifacts/faults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fault-evidence
          path: artifacts/faults
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.6
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/e2e/test_compose.py -m compose -q
        env:
          RUN_COMPOSE: '1'
          RUN_LOAD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-evidence
          path: artifacts/load.json
