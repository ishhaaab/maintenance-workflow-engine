name: Admission latency comparison
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline revision
        required: true
        default: ec611a716bf6684117d976e0f78449cc7d8b9372
      candidate_ref:
        description: Optimized revision
        required: true
        default: main
      repetitions:
        description: Groups of 100 workflows per revision
        required: true
        default: '3'
      profile_api:
        description: Instrument the candidate only for diagnosis
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.6
      - run: uv sync --frozen --extra dev
        working-directory: candidate
      - name: Compare full-workflow admission latency
        working-directory: candidate
        env:
          REPETITIONS: ${{ inputs.repetitions }}
          PROFILE_API: ${{ inputs.profile_api }}
        run: uv run python scripts/benchmark_admission.py --baseline ../baseline --candidate . --repetitions "$REPETITIONS" --profile-api "$PROFILE_API" --output-dir artifacts/admission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-evidence
          path: candidate/artifacts/admission
