{% macro token(csrf) %}<input type="hidden" name="csrf" value="{{ csrf }}">{% endmacro %}
{% macro revision(value) %}<input type="hidden" name="expected_revision" value="{{ value }}">{% endmacro %}
{% macro status(value) %}<span class="status status-{{ (value or 'UNSUBMITTED') | lower }}">{{ value | label }}</span>{% endmacro %}
